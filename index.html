<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotating Wheel on Hover</title>
  <style>
    body {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }

    .wheel {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #ff6a00, #ffcc00);
      border-radius: 50%;
      transition: transform 1s ease;
    }

    .wheel:hover {
      transform: rotate(360deg);
    }
  </style>
</head>
<body>
  <div class="wheel">
    <img src="square-color-wheel-scheme.jpg" alt="Color Wheel" style="width: 100%; height: 100%; border-radius: 50%;">
  </div>
</body>
</html>
